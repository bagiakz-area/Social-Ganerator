<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Costum your SocialCard — Card Generator</title>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="assets/img/GIAR.png" />
  </head>
  <body>
    <div class="scb-root" id="scbRoot">
      <div class="scb-header">
        <h1>Connect Social — Card Builder</h1>
        <p>Social Card Generator for your GitHub README</p>
      </div>

      <div class="scb-layout">
        <div class="scb-controls">
          <div class="scb-panel">
            <h2>Thame Colors</h2>
            <div class="scb-row">
              <label>Border / Glow</label><input type="color" id="th-border" />
            </div>
            <div class="scb-row">
              <label>Icon, Title, chevron</label
              ><input type="color" id="th-gold" />
            </div>
            <div class="scb-row">
              <label>Teks status</label><input type="color" id="th-status" />
            </div>
            <div class="scb-row">
              <label>Background top</label><input type="color" id="th-bgTop" />
            </div>
            <div class="scb-row">
              <label>Background bottom</label
              ><input type="color" id="th-bgBottom" />
            </div>
          </div>

          <div class="scb-panel" id="cardsPanel">
            <h2>Platform</h2>
            <div id="cardEditList"></div>
            <button
              class="scb-btn wide"
              id="addCardBtn"
              style="margin-top: 8px"
            >
              + Add platform
            </button>
          </div>
        </div>

        <div class="scb-preview">
          <div class="scb-grid" id="cardsGrid"></div>

          <div class="scb-panel scb-export">
            <h2>Export to README</h2>
            <div class="scb-export-actions">
              <button class="scb-btn" id="downloadZipBtn">
                Download all (.zip)
              </button>
              <button class="scb-btn" id="copySnippetBtn">
                Copy HTML Code
              </button>
              <span class="scb-toast" id="toast">Copied!</span>
            </div>
            <textarea id="snippetOutput" readonly></textarea>
            <p class="scb-hint">NOTE : You must download the socialcard (.svg) file and place it in your repository for the HTML code to function properly</p>
          </div>
          <p class="footer">
            <iconify-icon icon="line-md:github"></iconify-icon> : <a href="https://github.com/bagiakz-area">bagiakz-area</a>
          </p>
        </div>
      </div>
    </div>

            path: "M15.725 0l-1.72 1.277 6.39 8.588 1.716-1.277L15.725 0zm-3.94 3.418l-1.369 1.644 8.225 6.85 1.369-1.644-8.225-6.85zm-3.15 4.465l-.905 1.94 9.702 4.517.904-1.94-9.701-4.517zm-1.85 4.86l-.44 2.093 10.473 2.201.44-2.092-10.473-2.203zM1.89 15.47V24h19.19v-8.53h-2.133v6.397H4.021v-6.396H1.89zm4.265 2.133v2.13h10.66v-2.13H6.154Z",
          },
          spotify: {
            path: "M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z",
          },
        };

        const theme = {
          border: "#00E5FF",
          gold: "#E0FFFF",
          status: "#3B82F6",
          bgTop: "#0F172A",
          bgBottom: "#020617",
        };

        let uid;
        let cards = [
          {
            id: 1,
            iconType: "brand",
            iconKey: "linkedin",
            title: "LINKEDIN",
            username: "@username",
            url: "https://linkedin.com/in/username",
            status: "CONNECTED",
          },
          {
            id: 2,
            iconType: "brand",
            iconKey: "telegram",
            title: "TELEGRAM",
            username: "@username",
            url: "https://t.me/username",
            status: "CONNECTED",
          },
          {
            id: 3,
            iconType: "brand",
            iconKey: "x",
            title: "X / TWITTER",
            username: "@username",
            url: "https://x.com/username",
            status: "CONNECTED",
          },
          {
            id: 4,
            iconType: "brand",
            iconKey: "instagram",
            title: "INSTAGRAM",
            username: "@username",
            url: "https://instagram.com/username",
            status: "CONNECTED",
          },
          {
            id: 5,
            iconType: "brand",
            iconKey: "hackster",
            title: "HACKSTER",
            username: "username",
            url: "https://hackster.io/username",
            status: "CONNECTED",
          },
          {
            id: 6,
            iconType: "brand",
            iconKey: "threads",
            title: "THREADS",
            username: "@username",
            url: "https://threads.net/@username",
            status: "CONNECTED",
          },
        ];

        const root = document.getElementById("scbRoot");
        const cardEditList = root.querySelector("#cardEditList");
        const cardsGrid = root.querySelector("#cardsGrid");
        const snippetOutput = root.querySelector("#snippetOutput");
        const toast = root.querySelector("#toast");

        function escapeXml(str) {
          return String(str)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");
        }

        function iconMarkup(card, accent, boxX, boxY, boxSize) {
          const pad = boxSize * 0.17;
          const inner = boxSize - pad * 2;
          if (card.iconType === "custom") {
            return (
              '<text x="' +
              (boxX + boxSize / 2) +
              '" y="' +
              (boxY + boxSize / 2 + boxSize * 0.15) +
              '" font-family="Georgia, serif" font-weight="700" font-size="' +
              boxSize * 0.46 +
              '" fill="' +
              accent +
              '" text-anchor="middle">' +
              escapeXml(card.iconGlyph || "?") +
              "</text>"
            );
          }
          const data = ICONS[card.iconKey];
          if (!data) return "";
          const scale = inner / 24;
          return (
            '<g transform="translate(' +
            (boxX + pad) +
            "," +
            (boxY + pad) +
            ") scale(" +
            scale.toFixed(4) +
            ')"><path d="' +
            data.path +
            '" fill="' +
            accent +
            '" /></g>'
          );
        }

        function cardSVG(card, uniqueId) {
          const w = 330,
            h = 108;
          const iconBox = { x: 24, y: h / 2 - 22, size: 44 };
          const bracket = 8,
            inset = 20;
          const corners = [
            [inset, inset, "M0," + bracket + " L0,0 L" + bracket + ",0"],
            [
              w - inset - bracket,
              inset,
              "M0,0 L" + bracket + ",0 L" + bracket + "," + bracket,
            ],
            [
              inset,
              h - inset - bracket,
              "M0,0 L0," + bracket + " L" + bracket + "," + bracket,
            ],
            [
              w - inset - bracket,
              h - inset - bracket,
              "M0," +
                bracket +
                " L" +
                bracket +
                "," +
                bracket +
                " L" +
                bracket +
                ",0",
            ],
          ];
          const cornerMarkup = corners
            .map(function (c) {
              return (
                '<path d="' +
                c[2] +
                '" transform="translate(' +
                c[0] +
                "," +
                c[1] +
                ')" fill="none" stroke="' +
                theme.gold +
                '" stroke-width="1.6" stroke-linecap="square" opacity="0.85" />'
              );
            })
            .join("");

          const title = escapeXml(card.title || "");
          const username = escapeXml(card.username || "");
          const status = escapeXml(card.status || "");

          return (
            '<svg width="' +
            w +
            '" height="' +
            h +
            '" viewBox="0 0 ' +
            w +
            " " +
            h +
            '" xmlns="http://www.w3.org/2000/svg">' +
            "<defs>" +
            '<linearGradient id="bg' +
            uniqueId +
            '" x1="0" y1="0" x2="1" y2="1">' +
            '<stop offset="0%" stop-color="' +
            theme.bgTop +
            '" />' +
            '<stop offset="100%" stop-color="' +
            theme.bgBottom +
            '" />' +
            "</linearGradient>" +
            '<filter id="glow' +
            uniqueId +
            '" x="-40%" y="-40%" width="180%" height="180%">' +
            '<feGaussianBlur stdDeviation="3.2" result="blur" />' +
            '<feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>' +
            "</filter>" +
            '<clipPath id="clip' +
            uniqueId +
            '">' +
            '<rect x="1" y="1" width="' +
            (w - 2) +
            '" height="' +
            (h - 2) +
            '" rx="14" />' +
            "</clipPath>" +
            '<linearGradient id="slash' +
            uniqueId +
            '" x1="0" y1="0" x2="1" y2="0">' +
            '<stop offset="0%" stop-color="' +
            theme.gold +
            '" stop-opacity="0" />' +
            '<stop offset="50%" stop-color="' +
            theme.gold +
            '" stop-opacity="0.32" />' +
            '<stop offset="100%" stop-color="' +
            theme.gold +
            '" stop-opacity="0" />' +
            "</linearGradient>" +
            "</defs>" +
            '<rect x="1" y="1" width="' +
            (w - 2) +
            '" height="' +
            (h - 2) +
            '" rx="14" fill="url(#bg' +
            uniqueId +
            ')" />' +
            '<g clip-path="url(#clip' +
            uniqueId +
            ')">' +
            '<g transform="rotate(-18 ' +
            w / 2 +
            " " +
            h / 2 +
            ')">' +
            '<rect x="-70" y="-40" width="72" height="' +
            (h + 80) +
            '" fill="url(#slash' +
            uniqueId +
            ')">' +
            '<animateTransform attributeName="transform" attributeType="XML" type="translate" values="-70 0;400 0" dur="7s" begin="-' +
            ((uniqueId * 1.6) % 7).toFixed(2) +
            's" repeatCount="indefinite" />' +
            "</rect>" +
            "</g>" +
            "</g>" +
            '<rect x="1" y="1" width="' +
            (w - 2) +
            '" height="' +
            (h - 2) +
            '" rx="14" fill="none" stroke="' +
            theme.border +
            '" stroke-width="1.4" filter="url(#glow' +
            uniqueId +
            ')" opacity="0.9" />' +
            cornerMarkup +
            '<rect x="' +
            iconBox.x +
            '" y="' +
            iconBox.y +
            '" width="' +
            iconBox.size +
            '" height="' +
            iconBox.size +
            '" rx="10" fill="none" stroke="' +
            theme.gold +
            '" stroke-width="1.6" />' +
            iconMarkup(card, theme.gold, iconBox.x, iconBox.y, iconBox.size) +
            '<text x="86" y="42" font-family="\'Courier New\', monospace" font-weight="700" font-size="15" letter-spacing="3" fill="' +
            theme.gold +
            '">' +
            title +
            "</text>" +
            '<text x="86" y="59" font-family="\'Courier New\', monospace" font-weight="600" font-size="11" letter-spacing="1" fill="' +
            theme.gold +
            '" opacity="0.75">' +
            username +
            "</text>" +
            '<circle cx="90" cy="78" r="3" fill="' +
            theme.status +
            '" />' +
            '<text x="100" y="82" font-family="\'Courier New\', monospace" font-weight="600" font-size="10" letter-spacing="2" fill="' +
            theme.status +
            '" opacity="0.9">' +
            status +
            "</text>" +
            '<text x="' +
            (w - 30) +
            '" y="' +
            (h / 2 + 6) +
            '" font-family="\'Courier New\', monospace" font-weight="700" font-size="18" fill="' +
            theme.gold +
            '" opacity="0.55">&#187;</text>' +
            "</svg>"
          );
        }

        function slugify(str, fallback) {
          const s = String(str || "")
            .toLowerCase()
            .replace(/[^a-z0-9]+/g, "-")
            .replace(/(^-|-$)/g, "");
          return s || fallback;
        }

        function renderPreview() {
          cardsGrid.innerHTML = "";
          cards.forEach(function (card) {
            const wrap = document.createElement("a");
            wrap.href = card.url || "#";
            wrap.target = "_blank";
            wrap.rel = "noopener";
            wrap.innerHTML = cardSVG(card, card.id);
            cardsGrid.appendChild(wrap);
          });
          updateSnippet();
        }

        function iconOptionsHtml(selected) {
          const keys = Object.keys(ICONS).sort();
          let html =
            '<option value="__custom__"' +
            (selected === "__custom__" ? " selected" : "") +
            ">Teks custom (huruf/simbol)</option>";
          keys.forEach(function (k) {
            html +=
              '<option value="' +
              k +
              '"' +
              (selected === k ? " selected" : "") +
              ">" +
              k +
              "</option>";
          });
          return html;
        }

        function buildCardEditor(card) {
          const el = document.createElement("div");
          el.className = "scb-card-edit";
          el.dataset.id = card.id;

          el.innerHTML =
            '<div class="scb-field"><label>Icon</label><select class="f-icon">' +
            iconOptionsHtml(
              card.iconType === "custom" ? "__custom__" : card.iconKey,
            ) +
            "</select></div>" +
            '<div class="scb-field f-glyph-wrap" style="display:' +
            (card.iconType === "custom" ? "block" : "none") +
            '"><label>Teks glyph (max 3 karakter)</label><input type="text" class="f-glyph" maxlength="3" value="' +
            (card.iconGlyph || "") +
            '"></div>' +
            '<div class="scb-field"><label>Title</label><input type="text" class="f-title" value="' +
            (card.title || "") +
            '"></div>' +
            '<div class="scb-inline">' +
            '<div class="scb-field"><label>Username</label><input type="text" class="f-username" value="' +
            (card.username || "") +
            '"></div>' +
            '<div class="scb-field"><label>Status</label><input type="text" class="f-status" value="' +
            (card.status || "") +
            '"></div>' +
            "</div>" +
            '<div class="scb-field"><label>Link URL</label><input type="text" class="f-url" value="' +
            (card.url || "") +
            '"></div>' +
            '<div class="scb-card-actions">' +
            '<button class="scb-btn f-download">Download SVG</button>' +
            '<button class="scb-btn danger f-delete">Delete</button>' +
            "</div>";

          el.querySelector(".f-icon").addEventListener("change", function (e) {
            if (e.target.value === "__custom__") {
              card.iconType = "custom";
              if (!card.iconGlyph) card.iconGlyph = "?";
            } else {
              card.iconType = "brand";
              card.iconKey = e.target.value;
            }
            el.querySelector(".f-glyph-wrap").style.display =
              card.iconType === "custom" ? "block" : "none";
            renderPreview();
          });
          el.querySelector(".f-glyph").addEventListener("input", function (e) {
            card.iconGlyph = e.target.value;
            renderPreview();
          });
          el.querySelector(".f-title").addEventListener("input", function (e) {
            card.title = e.target.value;
            renderPreview();
          });
          el.querySelector(".f-username").addEventListener(
            "input",
            function (e) {
              card.username = e.target.value;
              renderPreview();
            },
          );
          el.querySelector(".f-status").addEventListener("input", function (e) {
            card.status = e.target.value;
            renderPreview();
          });
          el.querySelector(".f-url").addEventListener("input", function (e) {
            card.url = e.target.value;
            renderPreview();
          });
          el.querySelector(".f-delete").addEventListener("click", function () {
            cards = cards.filter(function (c) {
              return c.id !== card.id;
            });
            renderControls();
            renderPreview();
          });
          el.querySelector(".f-download").addEventListener(
            "click",
            function () {
              const svg = cardSVG(card, card.id);
              const blob = new Blob([svg], { type: "image/svg+xml" });
              const a = document.createElement("a");
              a.href = URL.createObjectURL(blob);
              a.download = slugify(card.title, "card-" + card.id) + ".svg";
              a.click();
              URL.revokeObjectURL(a.href);
            },
          );

          return el;
        }

        function renderControls() {
          cardEditList.innerHTML = "";
          cards.forEach(function (card) {
            cardEditList.appendChild(buildCardEditor(card));
          });
        }

        function updateSnippet() {
          const items = cards
            .map(function (c) {
              const file =
                "assets/socials/" + slugify(c.title, "card-" + c.id) + ".svg";
              return (
                '  <a href="' +
                (c.url || "#") +
                '"><img src="' +
                file +
                '" width="330" alt="' +
                escapeXml(c.title) +
                '" /></a>'
              );
            })
            .join("\n");
          snippetOutput.value = "<p>\n" + items + "\n</p>";
        }

        root
          .querySelector("#addCardBtn")
          .addEventListener("click", function () {
            uid += 1;
            cards.push({
              id: uid,
              iconType: "custom",
              iconGlyph: "?",
              title: "PLATFORM BARU",
              username: "@usernamekamu",
              url: "https://example.com",
              status: "CONNECTED",
            });
            renderControls();
            renderPreview();
          });

        ["border", "gold", "status", "bgTop", "bgBottom"].forEach(
          function (key) {
            const input = root.querySelector("#th-" + key);
            input.value = theme[key];
            input.addEventListener("input", function (e) {
              theme[key] = e.target.value;
              renderPreview();
            });
          },
        );

        root
          .querySelector("#copySnippetBtn")
          .addEventListener("click", function () {
            snippetOutput.select();
            navigator.clipboard
              .writeText(snippetOutput.value)
              .then(function () {
                toast.classList.add("show");
                setTimeout(function () {
                  toast.classList.remove("show");
                }, 1500);
              })
              .catch(function () {
                document.execCommand("copy");
              });
          });

        root
          .querySelector("#downloadZipBtn")
          .addEventListener("click", function () {
            const zip = new JSZip();
            const folder = zip.folder("assets/socials");
            cards.forEach(function (card) {
              folder.file(
                slugify(card.title, "card-" + card.id) + ".svg",
                cardSVG(card, card.id),
              );
            });
            zip.generateAsync({ type: "blob" }).then(function (content) {
              const a = document.createElement("a");
              a.href = URL.createObjectURL(content);
              a.download = "socials-cards.zip";
              a.click();
              URL.revokeObjectURL(a.href);
            });
          });

        renderControls();
        renderPreview();
      })();
    </script>
  </body>
</html>
